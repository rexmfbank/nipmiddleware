configurations {
    jaxb
}

buildscript {
    ext {
        springBootVersion = '2.0.5.RELEASE'
        lombokVersion = '1.16.16'
    }
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath ("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
        classpath('se.transmode.gradle:gradle-docker:1.2')
    }
}

group = 'ga'


apply plugin: 'java'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'docker'


task buildDocker(type: Docker, dependsOn: build) {
    push = false
    applicationName = bootJar.baseName
    tag = 'nipmiddleware'
    dockerfile = file('Dockerfile')
    doFirst {
        copy {
            from bootJar
            into "build/docker"
        }
    }
}

sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
    mavenCentral()
    //flatDir {
    //  dirs 'libs'
    //}
}



// commented auto generation of sources



bootJar {
    baseName = 'nipmiddleware'
}

dependencies {
    compile ('org.springframework.boot:spring-boot-starter-web') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
    }
    compile ('org.springframework.boot:spring-boot-starter-jetty')
    compile("org.springframework.boot:spring-boot-starter-actuator")
    compile("org.springframework.boot:spring-boot-devtools")
    compile("org.springframework.boot:spring-boot-autoconfigure")
    compile("org.springframework.boot:spring-boot-starter-data-jpa")
    compile("org.springframework.boot:spring-boot-starter-security")


    //spring aws cloud
    compile group: 'org.springframework.cloud', name: 'spring-cloud-aws-autoconfigure', version: '1.2.2.RELEASE'
    compile group: 'org.springframework.cloud', name: 'spring-cloud-aws-context', version: '1.2.2.RELEASE'
    compile group: 'org.springframework.cloud', name: 'spring-cloud-aws-messaging', version: '1.2.2.RELEASE'

    // spring ws
    compile group: 'org.springframework.ws', name: 'spring-ws-core', version: '2.4.1.RELEASE'
    jaxb "com.sun.xml.bind:jaxb-xjc:2.1.7"

    compile("mysql:mysql-connector-java")
    compile("org.flywaydb:flyway-core")
    compile("wsdl4j:wsdl4j:1.6.1")

    compile group: 'org.apache.commons', name: 'commons-lang3', version: '3.4'
    compile group: 'org.apache.commons', name: 'commons-io', version: '1.3.2'
    compile group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.9.4'

    compileOnly("org.projectlombok:lombok:${lombokVersion}")
    testCompileOnly("org.projectlombok:lombok:${lombokVersion}")
    annotationProcessor("org.projectlombok:lombok:${lombokVersion}")
    testAnnotationProcessor("org.projectlombok:lombok:${lombokVersion}")

    compile group: 'com.google.guava', name: 'guava', version: '22.0'
    compile group: 'org.jsondoc', name: 'jsondoc-core', version: '1.2.11'
    compile group: 'org.jsondoc', name: 'jsondoc-ui-webjar', version: '1.2.11'
    compile group: 'com.google.inject', name: 'guice', version: '3.0'
    compile group: 'javax.jdo', name: 'jdo-api', version: '3.0.1'
    compile group: 'org.datanucleus', name: 'datanucleus-core', version: '4.1.7'
    compile group: 'com.google.gwt', name: 'gwt-user', version: '2.7.0'
    compile("org.apache.httpcomponents:httpclient")
    compile ("io.springfox:springfox-swagger2:2.9.2")
    compile ("io.springfox:springfox-swagger-ui:2.9.2")


    compile group: 'io.jsonwebtoken', name: 'jjwt', version: '0.9.0'
    compile group: 'com.amazonaws', name: 'aws-java-sdk-ssm', version: '1.11.414'

    compile fileTree(dir :'lib' ,include :'*.jar')

    runtime("com.h2database:h2:1.3.176")
    testCompile("junit:junit")
    testImplementation("org.springframework.boot:spring-boot-starter-test")

}

task getHomeDir() {
    println gradle.gradleHomeDir
}

if (!hasProperty('mainClass')) {
    ext.mainClass = 'com.globalaccelerex.nipmiddleware.Application'
}